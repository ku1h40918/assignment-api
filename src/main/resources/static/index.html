<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課題管理アプリ</title>
        <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        h1 {
            color: #245b91;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 20px;
            margin-top: 28px;
        }

        form,
        .assignment-item {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 14px;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input[type="number"] {
            width: 120px;
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font: inherit;
        }

        button {
            background-color: #245b91;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 16px;
            margin: 4px 4px 4px 0;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background-color: #19436d;
        }

        input:focus-visible,
        textarea:focus-visible,
        button:focus-visible {
            outline: 3px solid #e89b24;
            outline-offset: 2px;
        }

        .assignment-item {
            border-left: 5px solid #245b91;
            overflow-wrap: anywhere;
        }

        .assignment-item p {
            margin: 6px 0;
            white-space: pre-wrap;
        }

        .error {
            color: #b42318;
            font-weight: bold;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 28px 0;
        }
    </style>
</head>
<body>

<h1>課題管理アプリ</h1>

<div id="error-message" class="error" role="alert"></div>

<h2>1. 課題の登録・更新</h2>
<form id="create-form">
    <label>
        課題名
        <input type="text" id="title" maxlength="200" required>
    </label>
    <label>
        詳細
        <textarea id="content" required></textarea>
    </label>
    <label>
        締切日
        <input type="date" id="due-date" required>
    </label>
    <label>
        <input type="checkbox" id="completed">
        完了
    </label>
    <button type="submit">新規登録</button>
    <button type="button" onclick="updateAssignment()">
        指定したIDの課題を更新
    </button>
</form>

<hr>

<h2>2. 課題一覧</h2>
<button onclick="fetchAssignments()">一覧を更新</button>
<div id="assignments-list"></div>

<hr>

<h2>3. 個別課題操作</h2>
<label>
    課題ID
    <input type="number" id="assignment-id" min="1" step="1">
</label>
<button onclick="fetchAssignmentById()">検索・フォームに読み込む</button>
<button onclick="deleteAssignment()">削除</button>
<p>更新する場合は、IDで検索してからフォームを編集し、更新ボタンを押してください。</p>

<script src="app.js"></script>
</body>
</html>
